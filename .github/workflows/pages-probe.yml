name: pages-probe

# Temporary diagnostic: reports what the repository token is allowed to do with
# the Pages API. Removed once Pages is configured.

on:
  push:
    branches:
      - arena/01a0dc0a-flawly

permissions:
  contents: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "repo: ${{ github.repository }}"
            echo "run ref: ${{ github.ref }}"
            echo
            echo "== GET /repos/{owner}/{repo}/pages =="
            curl -sS -w "\nHTTP_STATUS %{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo
            echo "== POST /repos/{owner}/{repo}/pages (build_type=workflow) =="
            curl -sS -w "\nHTTP_STATUS %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo
            echo "== GET /repos/{owner}/{repo}/installation (app permissions) =="
            curl -sS -w "\nHTTP_STATUS %{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/installation"
          } > diagnostics/pages-probe.txt 2>&1
          cat diagnostics/pages-probe.txt

      - name: Commit probe result
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pages-probe.txt
          git commit -m "chore: pages api probe" || echo "nothing to commit"
          git push
